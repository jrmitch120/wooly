name: Pages

# Publishes site/ to GitHub Pages. The screenshots are not kept twice: the README's own, in docs/screenshots, are copied
# in when the site is put together, so a new screenshot reaches both the README and the site from one commit.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/screenshots/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and a newer push waits rather than cancelling one already under way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Put the site together
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Copy the site and its screenshots
        run: |
          mkdir -p _site/screenshots
          cp -R site/. _site/
          cp docs/screenshots/*.png _site/screenshots/

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
